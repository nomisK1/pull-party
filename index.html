<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FF9F1C">
<title>Pull Party</title>
<style>
  /* ---------- Tokens ---------- */
  :root{
    --bg: #FFF8F0;
    --text: #2B2530;
    --text-soft: #6b6270;
    --card: #FFFFFF;
    --sparkly-1: #FFD54A;
    --sparkly-2: #FF9F1C;
    --love-1: #FF7AA2;
    --love-2: #FF9F6B;
    --gold: #F5B93B;
    --gold-deep: #C9861A;
    --ex: #E8543A;
    --line: rgba(43,37,48,0.10);
    --shadow: 0 10px 24px rgba(43,37,48,0.14);
    --radius-lg: clamp(20px, 5vw, 32px);
    --radius-md: clamp(14px, 3.5vw, 20px);
    --tap: clamp(44px, 12vw, 64px);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }

  /* ---------- Reset / viewport lockdown ---------- */
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    margin: 0;
    background: var(--bg);
  }
  html{ height: -webkit-fill-available; }
  body{
    height: 100vh;
    height: 100dvh;
    min-height: -webkit-fill-available;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Segoe UI Rounded", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button{ font: inherit; color: inherit; }
  h1,h2,h3,p{ margin: 0; }

  /* ---------- App shell ---------- */
  #app{
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .screen{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-t) + 14px) calc(var(--safe-r) + 18px) calc(var(--safe-b) + 14px) calc(var(--safe-l) + 18px);
    min-height: 0;
  }
  .hidden{ display: none !important; }

  /* ---------- Header (Home) ---------- */
  .header{
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: clamp(8px, 2vh, 16px);
  }
  .brand{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    background: none;
    border: none;
    padding: 4px 2px;
    cursor: pointer;
    text-align: left;
  }
  .brand-title{
    font-weight: 900;
    font-size: clamp(20px, 5.5vw, 26px);
    letter-spacing: -0.02em;
  }
  .brand-sub{
    font-size: clamp(12px, 3.2vw, 14px);
    color: var(--text-soft);
    font-weight: 600;
  }
  .header-controls{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(4px, 1.6vw, 10px);
  }
  .icon-btn{
    width: clamp(36px, 9vw, 44px);
    height: clamp(36px, 9vw, 44px);
    border-radius: 50%;
    border: none;
    background: var(--card);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(16px, 4.5vw, 20px);
    cursor: pointer;
  }
  .text-link{
    border: none;
    background: none;
    color: var(--text-soft);
    font-weight: 700;
    font-size: clamp(11px, 3vw, 13px);
    padding: 6px 4px;
    cursor: pointer;
  }

  /* ---------- Home main buttons ---------- */
  .home-main{
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.6vh, 20px);
    min-height: 0;
    justify-content: center;
  }
  .big-btn{
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    border: none;
    border-radius: var(--radius-lg);
    color: white;
    font-weight: 900;
    font-size: clamp(20px, 6.4vw, 30px);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    box-shadow: var(--shadow);
    overflow: hidden;
    isolation: isolate;
  }
  .big-btn .emoji{ font-size: clamp(28px, 8vw, 40px); }
  .big-btn.sparkly{ background: linear-gradient(135deg, var(--sparkly-1), var(--sparkly-2)); }
  .big-btn.love{ background: linear-gradient(135deg, var(--love-1), var(--love-2)); }
  .big-btn::after{
    content: "";
    position: absolute;
    inset: -60% -20%;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.35) 50%, transparent 60%);
    transform: translateX(-120%);
    animation: shine 5.5s ease-in-out infinite;
    z-index: -1;
  }
  .big-btn.love::after{ animation-delay: 2.2s; }
  @keyframes shine{
    0%, 55%{ transform: translateX(-120%); }
    75%{ transform: translateX(120%); }
    100%{ transform: translateX(120%); }
  }

  /* ---------- Name entry ---------- */
  .center-card-screen{
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: clamp(14px, 3vh, 22px);
  }
  .center-card-screen .emoji-big{ font-size: clamp(44px, 14vw, 64px); }
  .center-card-screen h1{
    font-size: clamp(22px, 6.5vw, 30px);
    font-weight: 900;
  }
  .center-card-screen p.hint{
    color: var(--text-soft);
    font-size: clamp(13px, 3.6vw, 15px);
    font-weight: 600;
    max-width: 42ch;
  }
  .name-input{
    width: 100%;
    max-width: 340px;
    border: 2px solid var(--line);
    border-radius: var(--radius-md);
    padding: clamp(12px, 3vh, 16px) clamp(14px, 3.6vw, 18px);
    font-size: clamp(16px, 4.4vw, 18px);
    font-weight: 700;
    text-align: center;
    background: var(--card);
  }
  .name-input:focus{ outline: 3px solid var(--sparkly-2); outline-offset: 2px; }
  .stack-actions{
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 340px;
  }
  .primary-btn{
    border: none;
    border-radius: var(--radius-md);
    background: linear-gradient(135deg, var(--sparkly-1), var(--sparkly-2));
    color: white;
    font-weight: 900;
    font-size: clamp(16px, 4.4vw, 19px);
    padding: clamp(12px, 3vh, 16px);
    cursor: pointer;
    min-height: var(--tap);
  }
  .ghost-btn{
    border: none;
    background: none;
    color: var(--text-soft);
    font-weight: 700;
    font-size: clamp(14px, 3.8vw, 16px);
    padding: 8px;
    cursor: pointer;
    min-height: 44px;
  }

  /* ---------- Modals ---------- */
  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(43,37,48,0.42);
    display: flex;
    align-items: flex-end;
    z-index: 40;
  }
  @media (orientation: landscape){
    .modal-backdrop{ align-items: center; justify-content: center; }
  }
  .modal-sheet{
    width: 100%;
    max-height: calc(100dvh - var(--safe-t) - 12px);
    background: var(--bg);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 14px calc(var(--safe-r) + 16px) calc(var(--safe-b) + 12px) calc(var(--safe-l) + 16px);
    display: flex;
    flex-direction: column;
    min-height: 40vh; /* Better space filling */
    box-shadow: 0 -10px 30px rgba(43,37,48,0.25);
  }
  @media (orientation: landscape){
    .modal-sheet{
      max-width: 560px;
      border-radius: var(--radius-lg);
      max-height: calc(100dvh - 24px);
    }
  }
  .modal-head{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: clamp(12px, 2vh, 18px);
  }
  .modal-head h2{
    font-size: clamp(17px, 4.8vw, 21px);
    font-weight: 900;
  }
  .modal-close{
    width: 34px; height: 34px;
    border-radius: 50%;
    border: none;
    background: rgba(43,37,48,0.06);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    flex: 0 0 auto;
  }

  .rarity-grid{
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(10px, 2vw, 14px);
    overflow: hidden;
  }
  .rarity-btn{
    border: 2px solid var(--line);
    background: var(--card);
    border-radius: var(--radius-md);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    padding: 12px;
  }
  .rarity-btn .r-icon{ font-size: clamp(24px, 7vw, 32px); line-height: 1; }
  .rarity-btn .r-label{
    font-size: clamp(12px, 3vw, 14px);
    font-weight: 800;
    color: var(--text-soft);
  }
  .rarity-ex .r-icon{ color: var(--ex); }
  .rarity-star .r-icon{ color: var(--gold-deep); }
  .rarity-star.shiny .r-icon{
    background: linear-gradient(90deg,#FF9AA2,#FFD97A,#A8E6A1,#A0D8FF,#C9A8FF);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rarity-crown .r-icon{
    background: linear-gradient(135deg,#FFD700,#FFF3B0,#E8B923,#FFD700);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .tag-grid{
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(1, 1fr);
    gap: clamp(10px, 2vw, 14px);
    overflow: hidden;
  }
  .tag-btn{
    border: 2px solid var(--line);
    background: var(--card);
    border-radius: var(--radius-md);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-weight: 800;
    font-size: clamp(15px, 4vw, 18px);
    cursor: pointer;
    padding: 12px;
  }
  .tag-btn .t-icon{ font-size: clamp(20px, 5.5vw, 26px); }

  .newsession-text{
    color: var(--text-soft);
    font-weight: 600;
    font-size: clamp(13px, 3.6vw, 15px);
    padding-bottom: clamp(10px, 2.4vh, 16px);
  }
  .newsession-actions{ display:flex; gap: 10px; }
  .newsession-actions button{ flex: 1; }
  .danger-btn{
    border: none;
    border-radius: var(--radius-md);
    background: var(--ex);
    color: white;
    font-weight: 900;
    font-size: clamp(14px, 3.8vw, 16px);
    padding: clamp(11px, 2.8vh, 14px);
    cursor: pointer;
    min-height: var(--tap);
  }
  .cancel-btn{
    border: 2px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--card);
    color: var(--text);
    font-weight: 800;
    font-size: clamp(14px, 3.8vw, 16px);
    padding: clamp(11px, 2.8vh, 14px);
    cursor: pointer;
    min-height: var(--tap);
  }

  /* ---------- Celebration overlay ---------- */
  #celebration-overlay{
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(43,37,48,0.06);
  }
  #confetti-canvas{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .celebration-msg{
    position: relative;
    z-index: 1;
    font-weight: 900;
    font-size: clamp(34px, 12vw, 60px);
    color: var(--text);
    text-shadow: 0 4px 12px rgba(255,255,255,0.8);
    text-align: center;
    padding: 0 20px;
    transform: scale(0.8);
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
  @keyframes popIn {
    to { transform: scale(1); }
  }

  /* ---------- Awards & History ---------- */
  .awards-head{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: clamp(10px, 2.4vh, 16px);
  }
  .awards-head h1{
    font-size: clamp(20px, 5.6vw, 26px);
    font-weight: 900;
    flex: 1;
  }
  .awards-body{
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2vh, 16px);
    overflow: hidden;
  }
  .awards-summary-box{
    flex: 0 0 auto;
    background: var(--card);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow);
    padding: clamp(12px, 2vh, 16px);
    text-align: center;
    font-weight: 800;
    font-size: clamp(14px, 3.8vw, 16px);
    color: var(--text-soft);
  }
  .pull-history-list{
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-bottom: 16px;
    -webkit-overflow-scrolling: touch;
  }
  .history-item{
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .history-icon{ font-size: 24px; }
  .history-details{ flex: 1; }
  .history-title{ font-weight: 800; font-size: 15px; }
  .history-time{ font-weight: 600; font-size: 12px; color: var(--text-soft); }

  .finish-btn-wrapper{
    flex: 0 0 auto;
    padding-top: 10px;
  }

</style>
</head>
<body>

<div id="app">

  <!-- Name Entry -->
  <section id="screen-name-entry" class="screen center-card-screen hidden">
    <div class="emoji-big">🎉</div>
    <h1>Welcome to Pull Party!</h1>
    <p class="hint">Add a name if you'd like &mdash; totally optional.</p>
    <input id="name-input" class="name-input" type="text" maxlength="20" placeholder="Your name (optional)" autocomplete="off">
    <div class="stack-actions">
      <button id="name-submit" class="primary-btn">Let's go! 🎉</button>
      <button id="name-skip" class="ghost-btn">Skip</button>
    </div>
  </section>

  <!-- Home -->
  <section id="screen-home" class="screen hidden">
    <div class="header">
      <button id="brand-btn" class="brand" aria-label="Edit player name">
        <span class="brand-title">Pull Party</span>
        <span id="brand-sub" class="brand-sub hidden"></span>
      </button>
      <div class="header-controls">
        <button id="remove-last-btn" class="text-link hidden">Undo</button>
        <button id="awards-link" class="text-link">Awards</button>
        <button id="finish-link" class="text-link">Finish</button>
        <button id="mute-btn" class="icon-btn" aria-label="Toggle sound">🔇</button>
      </div>
    </div>

    <div class="home-main">
      <button id="sparkly-open" class="big-btn sparkly">
        <span class="emoji">✨</span><span>Something Sparkly!</span>
      </button>
      <button id="love-open" class="big-btn love">
        <span class="emoji">💛</span><span>Something I Love!</span>
      </button>
    </div>
  </section>

  <!-- Awards / Session Summary -->
  <section id="screen-awards" class="screen hidden">
    <div class="awards-head">
      <button id="awards-back" class="icon-btn" aria-label="Back to home">←</button>
      <h1 id="awards-title">Session Summary</h1>
    </div>
    <div class="awards-body">
      <div id="awards-summary" class="awards-summary-box"></div>
      
      <div id="pull-history" class="pull-history-list">
        <!-- History Items Injected Here -->
      </div>
    </div>
    <div class="finish-btn-wrapper">
      <button id="start-new-btn" class="primary-btn" style="width: 100%;">Start New Session</button>
    </div>
  </section>

</div>

<!-- Sparkly Modal -->
<div id="modal-sparkly" class="modal-backdrop hidden">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Which one matched? ✨</h2>
      <button class="modal-close" data-close="sparkly" aria-label="Close">✕</button>
    </div>
    <div id="rarity-grid" class="rarity-grid"></div>
  </div>
</div>

<!-- Love Modal -->
<div id="modal-love" class="modal-backdrop hidden">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>What did you love? 💛</h2>
      <button class="modal-close" data-close="love" aria-label="Close">✕</button>
    </div>
    <div id="tag-grid" class="tag-grid"></div>
  </div>
</div>

<!-- Name Edit Modal -->
<div id="modal-name-edit" class="modal-backdrop hidden">
  <div class="modal-sheet" style="min-height: auto;">
    <div class="modal-head">
      <h2>Playing as...</h2>
      <button class="modal-close" data-close="name-edit" aria-label="Close">✕</button>
    </div>
    <input id="name-edit-input" class="name-input" type="text" maxlength="20" placeholder="Your name (optional)" autocomplete="off">
    <div style="padding-top: 16px;" class="stack-actions">
      <button id="name-edit-save" class="primary-btn">Save</button>
      <button id="name-edit-clear" class="ghost-btn">Clear name</button>
    </div>
  </div>
</div>

<!-- Undo Confirmation Modal -->
<div id="modal-undo" class="modal-backdrop hidden">
  <div class="modal-sheet" style="min-height: auto;">
    <div class="modal-head">
      <h2>Undo Pull?</h2>
      <button class="modal-close" data-close="undo" aria-label="Close">✕</button>
    </div>
    <p id="undo-text" class="newsession-text"></p>
    <div class="newsession-actions">
      <button id="undo-cancel" class="cancel-btn">Keep it</button>
      <button id="undo-confirm" class="danger-btn">Remove</button>
    </div>
  </div>
</div>

<!-- Celebration Overlay -->
<div id="celebration-overlay" class="hidden">
  <canvas id="confetti-canvas"></canvas>
  <div id="celebration-msg" class="celebration-msg"></div>
</div>

<script>
(function(){
  "use strict";

  /* =========================================================
     DATA
  ========================================================= */
  var STORAGE_KEY = "pullPartySession";
  var MUTE_KEY = "pullPartyMuted";
  var SCHEMA_VERSION = 1;

  var RARITIES = [
    { id: "ex",          label: "EX",       icon: "🎫", cls: "rarity-ex" },
    { id: "star1",       label: "1★",       icon: "★",  cls: "rarity-star" },
    { id: "star1_shiny", label: "Shiny 1★", icon: "★",  cls: "rarity-star shiny" },
    { id: "star2",       label: "2★",       icon: "★★", cls: "rarity-star" },
    { id: "star2_shiny", label: "Shiny 2★", icon: "★★", cls: "rarity-star shiny" },
    { id: "star3",       label: "3★",       icon: "★★★",cls: "rarity-star" },
    { id: "crown",       label: "Crown",    icon: "♛",  cls: "rarity-crown" }
  ];

  var TAGS = [
    { id: "cute",       label: "Cute",          icon: "🐾" },
    { id: "funny",      label: "Funny",         icon: "😂" },
    { id: "cool_art",   label: "Cool Art",      icon: "🎨" },
    { id: "great_name", label: "Great Name",    icon: "🏷️" },
    { id: "loved_it",   label: "Just Loved It", icon: "❤️", full: true }
  ];

  var COPY = {
    small: ["Nice!", "Got it!", "Sweet!", "Logged!"],
    medium: ["Ooh, nice one! ✨", "Love that! 💛", "Great pull!", "Awesome!"],
    big: ["WOW! 👑", "AMAZING!! 🎉", "JACKPOT! ✨", "INCREDIBLE!! 👑"]
  };
  var lastCopy = { small: -1, medium: -1, big: -1 };

  var RARITY_LABEL = {};
  RARITIES.forEach(function(r){ RARITY_LABEL[r.id] = r.label; });
  var RARITY_ICON = {};
  RARITIES.forEach(function(r){ RARITY_ICON[r.id] = r.icon; });
  var TAG_LABEL = {};
  TAGS.forEach(function(t){ TAG_LABEL[t.id] = t.label; });
  var TAG_ICON = {};
  TAGS.forEach(function(t){ TAG_ICON[t.id] = t.icon; });

  /* =========================================================
     STATE
  ========================================================= */
  var state = null;
  var muted = true;

  function defaultState(){
    return {
      schemaVersion: SCHEMA_VERSION,
      playerName: null,
      sessionStarted: new Date().toISOString(),
      pulls: []
    };
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      if(!parsed || parsed.schemaVersion !== SCHEMA_VERSION || !Array.isArray(parsed.pulls)){
        return defaultState();
      }
      return parsed;
    }catch(e){
      return defaultState();
    }
  }

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  function loadMuted(){
    try{
      var raw = localStorage.getItem(MUTE_KEY);
      return raw === null ? true : raw === "1";
    }catch(e){ return true; }
  }
  function saveMuted(){
    try{ localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); }catch(e){}
  }

  function uuid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
      var r = Math.random()*16|0, v = c === "x" ? r : (r&0x3|0x8);
      return v.toString(16);
    });
  }

  /* =========================================================
     DOM refs
  ========================================================= */
  var screenNameEntry = document.getElementById("screen-name-entry");
  var screenHome = document.getElementById("screen-home");
  var screenAwards = document.getElementById("screen-awards");

  var nameInput = document.getElementById("name-input");
  var nameSubmit = document.getElementById("name-submit");
  var nameSkip = document.getElementById("name-skip");

  var brandBtn = document.getElementById("brand-btn");
  var brandSub = document.getElementById("brand-sub");
  var removeLastBtn = document.getElementById("remove-last-btn");
  var awardsLink = document.getElementById("awards-link");
  var finishLink = document.getElementById("finish-link");
  var muteBtn = document.getElementById("mute-btn");

  var sparklyOpenBtn = document.getElementById("sparkly-open");
  var loveOpenBtn = document.getElementById("love-open");

  var modalSparkly = document.getElementById("modal-sparkly");
  var modalLove = document.getElementById("modal-love");
  var modalNameEdit = document.getElementById("modal-name-edit");
  var modalUndo = document.getElementById("modal-undo");

  var rarityGrid = document.getElementById("rarity-grid");
  var tagGrid = document.getElementById("tag-grid");

  var nameEditInput = document.getElementById("name-edit-input");
  var nameEditSave = document.getElementById("name-edit-save");
  var nameEditClear = document.getElementById("name-edit-clear");

  var undoText = document.getElementById("undo-text");
  var undoCancel = document.getElementById("undo-cancel");
  var undoConfirm = document.getElementById("undo-confirm");

  var awardsBack = document.getElementById("awards-back");
  var awardsTitle = document.getElementById("awards-title");
  var awardsSummary = document.getElementById("awards-summary");
  var pullHistory = document.getElementById("pull-history");
  var startNewBtn = document.getElementById("start-new-btn");

  var celebrationOverlay = document.getElementById("celebration-overlay");
  var celebrationMsg = document.getElementById("celebration-msg");
  var confettiCanvas = document.getElementById("confetti-canvas");

  /* =========================================================
     Screen / modal helpers
  ========================================================= */
  function showScreen(id){
    [screenNameEntry, screenHome, screenAwards].forEach(function(s){
      s.classList.toggle("hidden", s.id !== "screen-" + id);
    });
  }

  function openModal(el){ el.classList.remove("hidden"); }
  function closeModal(el){ el.classList.add("hidden"); }

  // Simple direct modal closing
  document.querySelectorAll(".modal-close").forEach(function(btn){
    btn.addEventListener("click", function(e){
      closeModal(e.target.closest(".modal-backdrop"));
    });
  });

  [modalSparkly, modalLove, modalNameEdit, modalUndo].forEach(function(backdrop){
    backdrop.addEventListener("click", function(e){
      if(e.target === backdrop) closeModal(backdrop);
    });
  });

  /* =========================================================
     Rendering
  ========================================================= */
  function renderHome(){
    if(state.playerName){
      brandSub.textContent = "Playing as " + state.playerName;
      brandSub.classList.remove("hidden");
    } else {
      brandSub.classList.add("hidden");
    }
    removeLastBtn.classList.toggle("hidden", state.pulls.length === 0);
    muteBtn.textContent = muted ? "🔇" : "🔊";
  }

  function buildRarityGrid(){
    rarityGrid.innerHTML = "";
    RARITIES.forEach(function(r){
      var btn = document.createElement("button");
      btn.className = "rarity-btn " + r.cls;
      btn.innerHTML = '<span class="r-icon">' + r.icon + '</span><span class="r-label">' + r.label + '</span>';
      btn.addEventListener("click", function(){
        logPull("sparkly", r.id, []);
        closeModal(modalSparkly);
      });
      rarityGrid.appendChild(btn);
    });
  }

  function buildTagGrid(){
    tagGrid.innerHTML = "";
    TAGS.forEach(function(t){
      var btn = document.createElement("button");
      btn.className = "tag-btn";
      btn.innerHTML = '<span class="t-icon">' + t.icon + '</span><span>' + t.label + '</span>';
      btn.addEventListener("click", function(){
        logPull("love", null, [t.id]);
        closeModal(modalLove);
      });
      tagGrid.appendChild(btn);
    });
  }

  /* =========================================================
     Name entry / edit
  ========================================================= */
  function goToInitialScreen(){
    if(!state.playerName && state.pulls.length === 0){
      showScreen("name-entry");
      nameInput.value = "";
    } else {
      showScreen("home");
    }
    renderHome();
  }

  nameSubmit.addEventListener("click", function(){
    var v = nameInput.value.trim().slice(0,20);
    state.playerName = v.length ? v : null;
    saveState();
    showScreen("home");
    renderHome();
  });
  nameSkip.addEventListener("click", function(){
    state.playerName = null;
    saveState();
    showScreen("home");
    renderHome();
  });

  brandBtn.addEventListener("click", function(){
    nameEditInput.value = state.playerName || "";
    openModal(modalNameEdit);
    setTimeout(function(){ nameEditInput.focus(); }, 50);
  });
  nameEditSave.addEventListener("click", function(){
    var v = nameEditInput.value.trim().slice(0,20);
    state.playerName = v.length ? v : null;
    saveState();
    renderHome();
    closeModal(modalNameEdit);
  });
  nameEditClear.addEventListener("click", function(){
    state.playerName = null;
    saveState();
    renderHome();
    closeModal(modalNameEdit);
  });

  /* =========================================================
     Sparkly / Love Modals Open
  ========================================================= */
  sparklyOpenBtn.addEventListener("click", function(){ openModal(modalSparkly); });
  loveOpenBtn.addEventListener("click", function(){ openModal(modalLove); });

  /* =========================================================
     Logging + tiering
  ========================================================= */
  function logPull(type, detail, tags){
    var pull = {
      id: uuid(),
      timestamp: new Date().toISOString(),
      type: type,
      detail: detail || null,
      tags: tags || []
    };
    state.pulls.push(pull);
    saveState();
    renderHome();

    var tier = "small";
    if(type === "sparkly"){
      if(detail === "ex" || detail === "crown") tier = "big";
      else if(detail === "star3" || detail === "star2_shiny") tier = "medium";
      else tier = "small";
    } else {
      if(tags.indexOf("loved_it") !== -1) tier = "big";
      else if(tags.length > 0) tier = "medium";
    }
    celebrate(tier);
  }

  /* =========================================================
     Remove last / Undo Modal
  ========================================================= */
  removeLastBtn.addEventListener("click", function(){
    var last = state.pulls[state.pulls.length - 1];
    var displayName = last.type === "sparkly" ? RARITY_LABEL[last.detail] : TAG_LABEL[last.tags[0]];
    undoText.textContent = "Are you sure you want to remove your last pull (" + displayName + ")?";
    openModal(modalUndo);
  });

  undoCancel.addEventListener("click", function(){ closeModal(modalUndo); });
  undoConfirm.addEventListener("click", function(){
    state.pulls.pop();
    saveState();
    renderHome();
    closeModal(modalUndo);
  });

  /* =========================================================
     Awards & Finish Flow
  ========================================================= */
  function renderAwards(){
    awardsTitle.textContent = state.playerName ? (state.playerName + "'s Summary") : "Session Summary";

    if(state.pulls.length === 0){
      awardsSummary.textContent = "No pulls recorded yet!";
    } else {
      awardsSummary.textContent = "Total Pulls: " + state.pulls.length;
    }

    pullHistory.innerHTML = "";
    var reversedPulls = state.pulls.slice().reverse();
    
    reversedPulls.forEach(function(p){
      var time = new Date(p.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      var title = p.type === "sparkly" ? RARITY_LABEL[p.detail] : TAG_LABEL[p.tags[0]];
      var icon = p.type === "sparkly" ? RARITY_ICON[p.detail] : TAG_ICON[p.tags[0]];

      var row = document.createElement("div");
      row.className = "history-item";
      row.innerHTML = '<div class="history-icon">' + icon + '</div>' +
                      '<div class="history-details">' +
                        '<div class="history-title">' + title + '</div>' +
                        '<div class="history-time">' + time + '</div>' +
                      '</div>';
      pullHistory.appendChild(row);
    });
  }

  awardsLink.addEventListener("click", function(){
    renderAwards();
    showScreen("awards");
  });
  finishLink.addEventListener("click", function(){
    renderAwards();
    showScreen("awards");
  });
  awardsBack.addEventListener("click", function(){
    showScreen("home");
  });

  startNewBtn.addEventListener("click", function(){
    var keepName = state.playerName;
    state = defaultState();
    state.playerName = keepName;
    saveState();
    goToInitialScreen();
  });

  /* =========================================================
     Mute toggle
  ========================================================= */
  muteBtn.addEventListener("click", function(){
    muted = !muted;
    saveMuted();
    renderHome();
  });

  /* =========================================================
     Confetti & Sound
  ========================================================= */
  var confettiColors = ["#FFD54A", "#FF9F1C", "#FF7AA2", "#FF9F6B", "#A0D8FF", "#C9A8FF", "#A8E6A1"];
  var ctx = confettiCanvas.getContext("2d");
  var particles = [];
  var confettiRAF = null;
  var confettiEndAt = 0;

  function resizeCanvas(){
    confettiCanvas.width = window.innerWidth * window.devicePixelRatio;
    confettiCanvas.height = window.innerHeight * window.devicePixelRatio;
    confettiCanvas.style.width = window.innerWidth + "px";
    confettiCanvas.style.height = window.innerHeight + "px";
  }
  window.addEventListener("resize", resizeCanvas);

  function spawnParticles(count){
    var w = window.innerWidth, dpr = window.devicePixelRatio || 1;
    for(var i=0; i<count; i++){
      particles.push({
        x: (Math.random()*w) * dpr,
        y: -20 * dpr - Math.random()*40*dpr,
        vx: (Math.random()-0.5) * 6 * dpr,
        vy: (2 + Math.random()*6) * dpr,
        size: (6 + Math.random()*8) * dpr,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5) * 0.4,
        life: 1
      });
    }
  }

  function stepConfetti(){
    ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    var now = performance.now();
    var fadeStart = confettiEndAt - 500;
    particles.forEach(function(p){
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05 * (window.devicePixelRatio||1);
      p.rot += p.vr;
      if(now > fadeStart){
        p.life = Math.max(0, (confettiEndAt - now) / 500);
      }
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
      ctx.restore();
    });
    particles = particles.filter(function(p){ return p.y < confettiCanvas.height + 40 && p.life > 0; });
    if(now < confettiEndAt || particles.length > 0){
      confettiRAF = requestAnimationFrame(stepConfetti);
    } else {
      cancelAnimationFrame(confettiRAF);
      confettiRAF = null;
    }
  }

  function burstConfetti(count, durationMs){
    resizeCanvas();
    spawnParticles(count);
    confettiEndAt = performance.now() + durationMs;
    if(!confettiRAF){ confettiRAF = requestAnimationFrame(stepConfetti); }
  }

  var audioCtx = null;
  function ensureAudioCtx(){
    if(audioCtx) return audioCtx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
    return audioCtx;
  }
  document.addEventListener("pointerdown", function(){ ensureAudioCtx(); }, { once: true, passive: true });

  function playChime(tier){
    var ac = ensureAudioCtx();
    if(!ac || muted) return;
    if(ac.state === "suspended"){ ac.resume(); }
    
    var notes;
    if(tier === "big") notes = [523.25, 659.25, 783.99]; // C5 E5 G5
    else if(tier === "medium") notes = [523.25, 659.25]; // C5 E5
    else notes = [659.25]; // E5

    var t0 = ac.currentTime;
    notes.forEach(function(freq, i){
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      var start = t0 + i*0.11;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
      osc.connect(gain).connect(ac.destination);
      osc.start(start);
      osc.stop(start + 0.45);
    });
  }

  var celebrationTimer = null;
  var TIER_CONFIG = {
    small:  { count: 60,  duration: 1200, overlayMs: 1400 },
    medium: { count: 120, duration: 1800, overlayMs: 2000 },
    big:    { count: 250, duration: 2500, overlayMs: 2800 }
  };

  function pickCopy(tier){
    var pool = COPY[tier];
    var idx;
    if(pool.length === 1) idx = 0;
    else{
      do{ idx = Math.floor(Math.random()*pool.length); } while(idx === lastCopy[tier]);
    }
    lastCopy[tier] = idx;
    return pool[idx];
  }

  function celebrate(tier){
    var cfg = TIER_CONFIG[tier];
    celebrationMsg.textContent = pickCopy(tier);
    celebrationOverlay.classList.remove("hidden");
    burstConfetti(cfg.count, cfg.duration);
    playChime(tier);

    clearTimeout(celebrationTimer);
    celebrationTimer = setTimeout(dismissCelebration, cfg.overlayMs);
  }
  function dismissCelebration(){
    clearTimeout(celebrationTimer);
    celebrationOverlay.classList.add("hidden");
  }
  celebrationOverlay.addEventListener("click", dismissCelebration);

  /* =========================================================
     Init
  ========================================================= */
  function init(){
    state = loadState();
    muted = loadMuted();
    buildRarityGrid();
    buildTagGrid();
    resizeCanvas();
    goToInitialScreen();
  }
  init();

})();
</script>
</body>
</html>
